name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets docker-publish.yml gate the image on this same suite.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner; must speak the same VGI protocol as the SDK.
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  check:
    name: Lint, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Offline tests
        run: uv run pytest -q
      # The scripts resolve their dependencies from their own PEP 723 headers,
      # not from pyproject.toml; this proves those headers are sufficient.
      - name: Entry points start from their own headers
        run: |
          uv run --no-project hackernews_worker.py --help > /dev/null
          uv run --no-project serve.py --help > /dev/null

  # test/sql/*.test through DuckDB (the pinned haybarn-unittest + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh --
  # the same script `make test-sql` runs. It serves the API from the local mock
  # (test/mock_api/server.py), so nothing here reaches the live API.
  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the worker
        run: uv sync --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/ci/worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh

  catalog:
    name: Catalog metadata (vgi-lint, structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      # Structural tier only: no network, so it is safe on every push. The
      # linter is deliberately unpinned — the fleet tracks the current rule
      # set rather than a snapshot of an old one.
      - name: vgi-lint (structural)
        run: >
          uvx --from vgi-lint-check vgi-lint lint "uv run hackernews_worker.py"
          --no-execute --no-check-links --audit-waivers --fail-on warning
