#
# Build, test and publish the multi-arch (linux/amd64 + linux/arm64) image to
# ghcr.io/query-farm/vgi-hackernews, through the fleet's shared workflow. It
# boots the image on both architectures and checks /health before pushing.
# Images build on release tags only (:edge is no longer published): a vX.Y.Z tag
# publishes the release tags, after
# ci/check-version.sh confirms the tag matches the package version.
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-hackernews
      smoke_import: "vgi_hackernews, vgi, httpx2, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
