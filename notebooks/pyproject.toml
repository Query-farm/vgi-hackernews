[project]
name = "vgi-hackernews-notebooks"
version = "0.1.0"
description = "Recorded and live Hacker News ranking analysis through VGI"
requires-python = ">=3.13,<3.15"
dependencies = [
    "vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.41",
]

[tool.ruff]
builtins = ["access_comparison", "anchor_check", "checks", "coverage", "depth_counts", "leaders", "mix", "pairs", "root_context", "text_lengths", "time_span", "timeline"] # JupySQL result captures
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"] # Visible SQL and result-derived prose retain readable lines
